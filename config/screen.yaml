# Thresholds for the pressure screen. Each one says where it comes from.
# "book" = stated in a skill chapter. "convention" = analyst convention, not from the library.

gate0_min_variables: 8        # of 11. Design choice: never score an issuer on thin data.

gate1:                        # rate channel: pass if ANY holds
  refi_need_above: 1.0        # convention
  floating_share_above: 0.5   # convention
  coverage_refi_below: 2.0    # convention. Below 1.0 is Minsky's Ponzi finance (Cassidy ch16, book).

gate2:
  worst_fraction: 0.3334      # worst third of the sector on the margin group or the demand group

already_priced:
  price_below: 80             # cents. Evidence: price leads defaults (@junkbondinvest, 6 Nov 2026).
  implied_tier: CCC

refi_scope: full              # full = reprice all debt at the market yield. maturing = only debt due in 24 months and floating debt.
refi_horizon_months: 24
backed_discount: 0.5          # convention: an IG-backed top customer counts half in `concentration`
min_peer_group: 8             # below this, percentiles fall back from tier+sector to tier, then to everyone
price_window_days: 20         # trading days used for the current price, yield and spread
spread_change_days: 63        # about three months
cyclicality_min_quarters: 12
ponzi_coverage: 1.0           # book: Cassidy ch16
exclude_financials: true

backtest:
  quantile: 0.2               # top fifth against bottom fifth
  min_rate_ratio: 1.5         # failure test 1
  min_auc_within_spread_tercile: 0.55   # failure test 2. Design choice.
  max_gate_pass_rate: 0.40    # failure test 4
  downgrade_notches: 2
  coverage_fall: 1.0
  bootstrap: 500
  seed: 7
